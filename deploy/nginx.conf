# Owner: Archit | nginx for the single-server deploy (EC2, Ubuntu 24.04). Repo at /home/ubuntu/flanker-h4vortexa.
#
# Install (server blocks only; this file is included inside nginx's http {} context):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/proofchain
#   sudo ln -sf /etc/nginx/sites-available/proofchain /etc/nginx/sites-enabled/proofchain
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# nginx runs as www-data and must be able to traverse /home/ubuntu: sudo chmod o+x /home/ubuntu
#
# Public ports: 80 (registry), 8080 (verifier), 22. Ports 4000 (server), 8545 (Hardhat) and
# 8546 (rpc-proxy) listen on 127.0.0.1 only and are reached solely through the locations below.

# ---------------------------------------------------------------- registry app + API
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /home/ubuntu/flanker-h4vortexa/web/dist;
    index index.html;

    # Uploads are capped at 10 MB by the server; leave headroom for multipart overhead.
    client_max_body_size 12m;

    # The API, prefix kept (/api/documents -> http://127.0.0.1:4000/api/documents).
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # OCR (tesseract.js) and the AI call can be slow.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering on;
    }

    # Hashed build assets never change; cache them hard.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: client-side routes (/records, /confirm/REC-000001, ...) serve index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}

# ---------------------------------------------------------------- verifier app + read-only RPC
# Deliberately NO /api location: the verifier must never reach the registry server.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /home/ubuntu/flanker-h4vortexa/verifier/dist;
    index index.html;

    # JSON-RPC calls are tiny; rpc-proxy enforces 64 KB as well.
    client_max_body_size 64k;

    # Read-only JSON-RPC gate (deploy/rpc-proxy.mjs), which forwards allowlisted reads to Hardhat.
    location = /rpc {
        proxy_pass http://127.0.0.1:8546;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }

    # pdf.js worker is an ES module (.mjs); module workers require a JavaScript MIME type,
    # which older nginx mime.types files do not map for .mjs.
    location ~ ^/assets/.+\.mjs$ {
        types { }
        default_type application/javascript;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
